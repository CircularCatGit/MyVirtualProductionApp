name: Compile Unrestricted iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Native Swift Package Manifest
      run: |
        mkdir -p App/Sources
        mv *.swift App/Sources/ 2>/dev/null || true
        
        # Output a pristine, double-quote escaped Swift configuration manifest structure
        echo '// swift-tools-version: 5.10
        import PackageDescription
        let package = Package(
            name: "ARCameraTracking",
            platforms: [.iOS(.v15)],
            products: [.library(name: "ARCameraTracking", type: .dynamic, targets: ["ARCameraTracking"])],
            targets: [.target(name: "ARCameraTracking", path: "Sources")]
        )' > App/Package.swift

    - name: Compile Application Binary Framework
      run: |
        cd App
        # Compiles the Swift code targeting physical iPhone arm64 hardware via the official SDK
        xcodebuild -scheme ARCameraTracking -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Assemble Completed IPA Application Package
      run: |
        # 1. Reconstruct a clean iOS application wrapper directory bundle structure
        mkdir -p Payload/VirtualProduction.app
        
        # 2. Extract the compiled machine code binary from Xcode's DerivedData target output folder
        cp /Users/runner/Library/Developer/Xcode/DerivedData/App-*/Build/Products/Debug-iphoneos/PackageFrameworks/ARCameraTracking.framework/ARCameraTracking Payload/VirtualProduction.app/VirtualProduction
        
        # 3. Generate the mandatory metadata configuration profile mapping
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>VirtualProduction</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.virtualproduction</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>VirtualProd</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>NSCameraUsageDescription</key>
            <string>This application requires direct access to the camera chip for real-time spatial video tracking logs.</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
                <string>arkit</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>' > Payload/VirtualProduction.app/Info.plist

        # 4. Zip the entire compiled structural system folder into an installable application bundle format
        zip -r VirtualProduction_Unrestricted.ipa Payload/

    - name: Export Complete App Package Archive
      uses: actions/upload-artifact@v4
      with:
        name: Finished_VirtualProduction_IPA
        path: VirtualProduction_Unrestricted.ipa
