name: Compile Unrestricted iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Fresh Project Source Tree
      run: |
        rm -rf *
        mkdir -p App/Sources

    - name: Create Package Manifest
      run: |
        cat << 'EOF' > App/Package.swift
        // swift-tools-version: 5.10
        import PackageDescription
        let package = Package(
            name: "ARCameraTracking",
            platforms: [.iOS(.v15)],
            products: [.executable(name: "ARCameraTracking", targets: ["ARCameraTracking"])],
            targets: [.executableTarget(name: "ARCameraTracking", path: "Sources")]
        )
        EOF

    - name: Create main.swift
      run: |
        cat << 'EOF' > App/Sources/main.swift
        import UIKit
        UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
        EOF

    - name: Create AppDelegate.swift
      run: |
        cat << 'EOF' > App/Sources/AppDelegate.swift
        import UIKit
        class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                window = UIWindow(frame: UIScreen.main.bounds)
                let rootVC = ViewController()
                window?.rootViewController = rootVC
                window?.makeKeyAndVisible()
                return true
            }
        }
        EOF

    - name: Create Scene.swift
      run: |
        cat << 'EOF' > App/Sources/Scene.swift
        import SceneKit
        class Scene {
            func createScene() -> SCNScene { return SCNScene() }
        }
        EOF

    - name: Create DataRecorder.swift
      run: |
        cat << 'EOF' > App/Sources/DataRecorder.swift
        import Foundation
        import ARKit
        import SceneKit
        extension simd_float4x4 {
            var translation: SIMD3<Float> { return SIMD3<Float>(columns.3.x, columns.3.y, columns.3.z) }
            var quaternion: simd_quatf { return simd_quatf(self) }
        }
        class DataRecorder {
            var trackingData: [String] = []
            var frameCount = 0
            func startRecording() {
                trackingData = []
                frameCount = 0
                trackingData.append("Frame,Timestamp,PosX,PosY,PosZ,RotX,RotY,RotZ,RotW")
            }
            func stopRecording() {
                let documentsPath = NSSearchPathForDirectoriesInDomains(.documentDirectory, .userDomainMask, true)[0]
                let filePath = "\(documentsPath)/tracking_data.csv"
                let dataString = trackingData.joined(separator: "\n")
                try? dataString.write(to: URL(fileURLWithPath: filePath), atomically: true, encoding: .utf8)
            }
            func recordFrame(_ frame: ARFrame) {
                frameCount += 1
                let timestamp = Date().timeIntervalSince1970
                let transformMatrix = frame.camera.transform
                let pos = transformMatrix.translation
                let rot = transformMatrix.quaternion
                let dataRow = String(format: "%d,%.4f,%.6f,%.6f,%.6f,%.6f,%.6f,%.6f,%.6f",
                                     frameCount, timestamp, pos.x, pos.y, pos.z,
                                     rot.vector.x, rot.vector.y, rot.vector.z, rot.vector.w)
                self.trackingData.append(dataRow)
            }
        }
        EOF

    - name: Create ModelImporter.swift
      run: |
        cat << 'EOF' > App/Sources/ModelImporter.swift
        import UIKit
        import SceneKit
        import UniformTypeIdentifiers
        public class ModelImporter: NSObject, UIDocumentPickerDelegate {
            public var delegate: ViewController?
            public func importModel() {
                let documentPicker = UIDocumentPickerViewController(forOpeningContentTypes: [.item, .data, .content])
                documentPicker.delegate = self
                documentPicker.allowsMultipleSelection = false
                documentPicker.modalPresentationStyle = .fullScreen
                delegate?.present(documentPicker, animated: true, completion: nil)
            }
            public func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                guard let url = urls.first else { return }
                if url.startAccessingSecurityScopedResource() {
                    defer { url.stopAccessingSecurityScopedResource() }
                    do {
                        let sceneKitScene = try SCNScene(url: url, options: nil)
                        DispatchQueue.main.async {
                            let importedNode = SCNNode()
                            for child in sceneKitScene.rootNode.childNodes { importedNode.addChildNode(child) }
                            importedNode.scale = SCNVector3(1.0, 1.0, 1.0)
                            self.delegate?.pendingModelNode = importedNode
                            let alert = UIAlertController(title: "Model Loaded", message: "Tap anywhere on a detected surface grid layout to anchor the 3D object down!", preferredStyle: .alert)
                            alert.addAction(UIAlertAction(title: "Got it", style: .default))
                            self.delegate?.present(alert, animated: true)
                        }
                    } catch { print("Error parsing 3D asset: \(error.localizedDescription)") }
                }
            }
        }
        EOF

    - name: Create ViewController.swift
      run: |
        cat << 'EOF' > App/Sources/ViewController.swift
        import UIKit
        import ARKit
        import SceneKit
        public class ViewController: UIViewController, ARSCNViewDelegate, ARSessionDelegate {
            public var sceneView: ARSCNView!
            public var recordButton: UIButton!
            public var importButton: UIButton!
            public var isRecording = false
            public var dataRecorder: DataRecorder?
            public var modelImporter = ModelImporter()
            public var pendingModelNode: SCNNode?
            public override func viewDidLoad() {
                super.viewDidLoad()
                sceneView = ARSCNView(frame: self.view.bounds)
                sceneView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                self.view.addSubview(sceneView)
                sceneView.delegate = self
                sceneView.session.delegate = self
                sceneView.showsStatistics = true
                sceneView.autoenablesDefaultLighting = true
                sceneView.layer.contents = nil
                sceneView.scene.background.contents = UIColor.black 
                let tapGesture = UITapGestureRecognizer(target: self, action: #selector(handleTap(_:)))
                sceneView.addGestureRecognizer(tapGesture)
                recordButton = UIButton(type: .system)
                recordButton.frame = CGRect(x: 30, y: self.view.bounds.height - 100, width: 140, height: 50)
                recordButton.setTitle("Start Recording", for: .normal)
                recordButton.backgroundColor = UIColor.systemBlue
                recordButton.setTitleColor(.white, for: .normal)
                recordButton.layer.cornerRadius = 10
                recordButton.addTarget(self, action: #selector(recordButtonTapped(_:)), for: .touchUpInside)
                self.view.addSubview(recordButton)
                importButton = UIButton(type: .system)
                importButton.frame = CGRect(x: self.view.bounds.width - 170, y: self.view.bounds.height - 100, width: 140, height: 50)
                importButton.setTitle("Import Model", for: .normal)
                importButton.backgroundColor = UIColor.darkGray
                importButton.setTitleColor(.white, for: .normal)
                importButton.layer.cornerRadius = 10
                importButton.addTarget(self, action: #selector(importButtonTapped(_:)), for: .touchUpInside)
                self.view.addSubview(importButton)
                let configuration = ARWorldTrackingConfiguration()
                configuration.planeDetection = [.horizontal]
                sceneView.session.run(configuration, options: [.resetTracking, .removeExistingAnchors])
                dataRecorder = DataRecorder()
                modelImporter.delegate = self
            }
            public override func viewWillAppear(_ animated: Bool) {
                super.viewWillAppear(animated)
                sceneView.scene.rootNode.eulerAngles = SCNVector3(0, 0, 0)
            }
            public override func viewWillDisappear(_ animated: Bool) {
                super.viewWillDisappear(animated)
                sceneView.session.pause()
            }
            @objc func handleTap(_ gestureRecognize: UIGestureRecognizer) {
                guard let modelNode = pendingModelNode else { return }
                let tapLocation = gestureRecognize.location(in: sceneView)
                let query = sceneView.raycastQuery(from: tapLocation, allowing: .estimatedPlane, alignment: .horizontal)
                if let raycastQuery = query {
                    let results = sceneView.session.raycast(raycastQuery)
                    if let hitResult = results.first {
                        modelNode.removeFromParentNode()
                        let transform = hitResult.worldTransform
                        modelNode.position = SCNVector3(transform.columns.3.x, transform.columns.3.y, transform.columns.3.z)
                        modelNode.eulerAngles = SCNVector3(0, 0, 0)
                        sceneView.scene.rootNode.addChildNode(modelNode)
                        pendingModelNode = nil
                    }
