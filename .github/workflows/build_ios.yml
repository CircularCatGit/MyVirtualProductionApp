name: Compile Unrestricted iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Native Swift Package Manifest
      run: |
        mkdir -p App/Sources
        mv *.swift App/Sources/ 2>/dev/null || true
        
        # Output a pristine, double-quote escaped Swift configuration manifest
        echo '// swift-tools-version: 5.10
        import PackageDescription
        let package = Package(
            name: "ARCameraTracking",
            platforms: [.iOS(.v15)],
            products: [.library(name: "ARCameraTracking", type: .dynamic, targets: ["ARCameraTracking"])],
            targets: [.target(name: "ARCameraTracking", path: "Sources")]
        )' > App/Package.swift

    - name: Compile Application Binary Framework
      run: |
        cd App
        # Native Xcode 15+ can read Package.swift directly using auto-generated schemes!
        xcodebuild -scheme ARCameraTracking -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Archive Code Objects
      uses: actions/upload-artifact@v4
      with:
        name: Compiled_ARCamera_Objects
        # Pulls the finished compiled dynamic app framework objects straight out of the Xcode build folder
        path: /Users/runner/Library/Developer/Xcode/DerivedData/App-*/Build/Products/Debug-iphoneos/
