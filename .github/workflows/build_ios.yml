name: Compile Unrestricted iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the compilation manually

jobs:
  build:
    runs-on: macos-14 # Provisions an authentic Apple runtime environment channel
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Dummy Project Wrapper
      run: |
        # Creates a structural command-line Swift project frame to satisfy the package manager
        mkdir -p App/Sources
        mv *.swift App/Sources/ 2>/dev/null || true
        
        # Explicitly declare the modern swift-tools-version with escaped double quotes
        echo '// swift-tools-version: 5.10
        import PackageDescription
        let package = Package(
            name: "ARCameraTracking",
            platforms: [.iOS(.v15)],
            products: [.library(name: "ARCameraTracking", targets: ["ARCameraTracking"])],
            targets: [.target(name: "ARCameraTracking", path: "Sources")]
        )' > App/Package.swift

    - name: Compile Application Binary
      run: |
        cd App
        # Compiles the Swift code targeting arm64 iOS hardware devices directly using pure swift tools
        swift build -c release --triple arm64-apple-ios15.0

    - name: Archive Code Objects
      uses: actions/upload-artifact@v4
      with:
        name: Compiled_ARCamera_Objects
        path: App/.build/arm64-apple-ios15.0/release/
