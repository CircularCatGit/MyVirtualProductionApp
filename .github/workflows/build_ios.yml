    - name: Assemble Completed IPA Application Package
      run: |
        # 1. Clean out any legacy folder caches and build a fresh workspace bundle container
        rm -rf Payload/
        mkdir -p Payload/VirtualProduction.app
        
        # 2. Dynamically scan Xcode's build paths to grab the exact native arm64 application binary executable
        BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData/ -type f -name "ARCameraTracking" ! -name "*.json" ! -name "*.LinkFileList" | head -n 1)
        cp "$BINARY_PATH" Payload/VirtualProduction.app/VirtualProduction
        
        # 3. Generate the absolute system configuration parameter list
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>VirtualProduction</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.virtualproduction</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>VirtualProd</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>NSCameraUsageDescription</key>
            <string>This application requires access to the camera chip layer for real-time spatial VR tracking data telemetry logs.</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
                <string>arkit</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>' > Payload/VirtualProduction.app/Info.plist

        # 4. Zip the entire compiled structural system folder into an installable application bundle format
        zip -r VirtualProduction_Unrestricted.ipa Payload/

    - name: Export Complete App Package Archive
      uses: actions/upload-artifact@v4
      with:
        name: Finished_VirtualProduction_IPA
        path: VirtualProduction_Unrestricted.ipa
