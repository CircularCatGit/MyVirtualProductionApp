name: Compile Unrestricted iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-14 
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Native Swift Package Manifest
      run: |
        # 1. Clear out any accidental duplicated folder structures to prevent duplicate class conflicts
        mkdir -p App/Sources
        
        # 2. Safely find and move exactly one unique copy of each file into the compilation root
        find . -maxdepth 3 -name "main.swift" -exec mv {} App/Sources/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "AppDelegate.swift" -exec mv {} App/Sources/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "ViewController.swift" -exec mv {} App/Sources/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "ModelImporter.swift" -exec mv {} App/Sources/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "DataRecorder.swift" -exec mv {} App/Sources/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "Scene.swift" -exec mv {} App/Sources/ \; 2>/dev/null || true
        
        # 3. Purge any remaining loose redundant folder trees out of memory
        rm -rf ARCameraTrackingAndVirtualProduction/ 2>/dev/null || true
        
        # 4. Output the pristine Swift Package Configuration file
        echo '// swift-tools-version: 5.10
        import PackageDescription
        let package = Package(
            name: "ARCameraTracking",
            platforms: [.iOS(.v15)],
            products: [.executable(name: "ARCameraTracking", targets: ["ARCameraTracking"])],
            targets: [.executableTarget(name: "ARCameraTracking", path: "Sources")]
        )' > App/Package.swift

    - name: Compile Application Binary Executable
      run: |
        cd App
        xcodebuild -scheme ARCameraTracking -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

    - name: Assemble Completed IPA Application Package
      run: |
        rm -rf Payload/
        mkdir -p Payload/VirtualProduction.app
        
        BINARY_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData/ -type f -name "ARCameraTracking" ! -name "*.json" ! -name "*.LinkFileList" | head -n 1)
        cp "$BINARY_PATH" Payload/VirtualProduction.app/VirtualProduction
        
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>VirtualProduction</string>
            <key>CFBundleIdentifier</key>
            <string>com.custom.virtualproduction</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>VirtualProd</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>NSCameraUsageDescription</key>
            <string>This application requires access to the camera chip layer for real-time spatial VR tracking data telemetry logs.</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
                <string>arkit</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>' > Payload/VirtualProduction.app/Info.plist

        zip -r VirtualProduction_Unrestricted.ipa Payload/

    - name: Export Complete App Package Archive
      uses: actions/upload-artifact@v4
      with:
        name: Finished_VirtualProduction_IPA
        path: VirtualProduction_Unrestricted.ipa
